  applications and companion experiences for iOS and Android. Its published apps include Kindred (AI
  stories and roleplay), Muze (AI fashion photography), Booboo (long-distance relationship tracker),
  Pocket Frens (self-care and habit tracker), and Minime (AI motivational buddy). Surfaced as an a16z
  portfolio company and added to the API Evangelist network. As of this enrichment pass the company
  publishes no public API, developer portal, SDK, documentation, or /.well-known surface — it is a
  business-to-consumer app studio rather than an API provider.
